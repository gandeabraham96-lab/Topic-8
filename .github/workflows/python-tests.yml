name: Python Tests

on:
  push:
    # Practical difference: tests run automatically when code is pushed,
    # but they do not run automatically for pull request events.

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run:  python -m pytest Topic8_4_c1.py Topic8_4_c2.py Topic8_4_c3.py Topic8_4_p.py